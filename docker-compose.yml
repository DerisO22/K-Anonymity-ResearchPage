version: '3.8'

# Adjust ports and environment variables for backend dev
services:
  frontend:
    image: node:lts-alpine
    workking_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  backend:
    image: node:lts-alpine
    working_dir: /server
    volumes:
      - ./server:/server
      - /server/node_modules
    ports: 
      - "3001:3001"
    environment:
      - NODE_ENV:development
      - DATABASE_URL=postgres://example-database-user:HmxWFa4EgEYJnjs7ABdLRELS4fpv86vL@example-database:5432/example-database
      - CORS_URL=http://localhost:5173
    depends_on:
      - example-database
    command: sh -c "npm install && node server.ts"